name: careline-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appointments_dev
      POSTGRES_USER: careline_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-local.ps1 first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - careline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careline_app -d appointments_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  careline-postgres:
